# crabfinder notability whitelist (file 13 §4, file 14 §1 metric #14)
#
# Each entry contributes a `boost_multiplier` (> 1.0) applied to BM25
# at query time via Tantivy's TopDocs::tweak_score, against any address
# whose building_group_id is in `target_building_group_ids`.
#
# Higher multiplier = stronger 'this is the famous one' signal.
# 3.0 = UNESCO / globally famous; 2.0–2.5 = nationally iconic;
# 1.8 = locally known.
#
# To add an entry, query the service with the canonical name +
# postal_code, capture top-N building_group_ids whose street_name
# matches the place, and PR an entry. The schema is intentionally
# small so contributions are low-friction.

