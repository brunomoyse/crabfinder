[package]
name = "crabfinder-eval"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Evaluation runner for crabfinder — synthetic + adversarial eval sets, metrics, reports, diffs."

[[bin]]
name = "crabfinder-eval"
path = "src/main.rs"

[dependencies]
crabfinder-core    = { workspace = true }
crabfinder-indexer = { workspace = true }
crabfinder-parser  = { workspace = true }
# Batch mode reuses the resolver, the abbreviation/mid_street loaders, and
# AddressCountIndex — all part of crabfinder-service's library surface.
crabfinder-service = { path = "../crabfinder-service" }

tantivy            = { workspace = true }

# Async + HTTP
tokio              = { workspace = true }
reqwest            = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
futures            = "0.3"

# Serialization
serde              = { workspace = true }
serde_json         = { workspace = true }
serde_yaml         = "0.9"
flate2             = "1.0"  # gzip for report-detail.json.gz

# Random sampling (seeded, reproducible)
rand               = { version = "0.9", features = ["std_rng"] }
rand_chacha        = "0.9"  # explicit seedable PRNG

# CLI / errors / logging
clap               = { workspace = true }
anyhow             = { workspace = true }
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
tempfile           = "3.10"
