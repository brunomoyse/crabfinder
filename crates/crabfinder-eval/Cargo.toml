[package]
name = "crabfinder-eval"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Evaluation runner for crabfinder — synthetic + adversarial eval sets, metrics, reports, diffs."

[[bin]]
name = "crabfinder-eval"
path = "src/main.rs"

[dependencies]
crabfinder-core    = { workspace = true }
crabfinder-indexer = { workspace = true }
crabfinder-parser  = { workspace = true }
# Batch mode reuses the resolver, the abbreviation/mid_street loaders, and
# AddressCountIndex — all part of crabfinder-service's library surface.
crabfinder-service = { path = "../crabfinder-service" }

tantivy            = { workspace = true }

# Async + HTTP
tokio              = { workspace = true }
reqwest            = { version = "0.13", default-features = false, features = ["json", "query", "rustls"] }
futures            = "0.3"

# Serialization
serde              = { workspace = true }
serde_json         = { workspace = true }
serde-saphyr       = "2"
flate2             = "1.1"  # gzip for report-detail.json.gz
csv                = "1.4"  # PhacochR file adapter (v3 Phase 11.1)

# Random sampling (seeded, reproducible)
rand               = { version = "0.10", features = ["std_rng"] }
rand_chacha        = "0.10"  # explicit seedable PRNG

# CLI / errors / logging
clap               = { workspace = true }
anyhow             = { workspace = true }
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
crabfinder-test-support = { workspace = true }
tempfile           = "3.27"
axum               = { workspace = true }
insta              = { workspace = true }
